apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: boost
spec:
  minReplicas: {{.Values.hpaMinReplicas}}
  maxReplicas: 12
  metrics:
  - resource:
      name: cpu
      target:
        # Percent of the pod's CPU request. Each gunicorn worker uses at most
        # one core, so keep this in step with gunicornWorkers and wsgiResources.
        averageUtilization: 40
        type: Utilization
    type: Resource
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: boost
